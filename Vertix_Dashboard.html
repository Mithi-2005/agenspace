<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Vertix Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #e6e6ea;
        --shell: #f4f4f6;
        --card: #fff;
        --ink: #16161a;
        --mut: #8b8b95;
        --line: #ececf0;
        --soft: #f3f3f6;
        --acc: #e8572a;
        --acc2: #f28a4f;
        --ok: #1f9d63;
        --okbg: #e4f6ec;
        --bad: #d9463a;
        --badbg: #fdeae8;
        --dark: #16161a;
        --onDark: #fff;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0c0c0e;
          --shell: #16161a;
          --card: #1e1e23;
          --ink: #f3f3f5;
          --mut: #9696a0;
          --line: #2a2a30;
          --soft: #26262c;
          --okbg: #14301f;
          --badbg: #3a1a17;
          --dark: #f3f3f5;
          --onDark: #16161a;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0c0c0e;
        --shell: #16161a;
        --card: #1e1e23;
        --ink: #f3f3f5;
        --mut: #9696a0;
        --line: #2a2a30;
        --soft: #26262c;
        --okbg: #14301f;
        --badbg: #3a1a17;
        --dark: #f3f3f5;
        --onDark: #16161a;
        color-scheme: dark;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font:
          14px/1.4 Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
      }
      button {
        font: inherit;
        color: inherit;
        border: 0;
        background: none;
        cursor: pointer;
      }
      svg {
        width: 16px;
        height: 16px;
        flex: none;
      }
      .shell {
        max-width: 1240px;
        margin: 16px auto;
        background: var(--shell);
        border-radius: 28px;
        padding: 16px 20px 28px;
        transition: background 0.3s;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .pill {
        background: var(--card);
        border-radius: 99px;
        padding: 5px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .logo {
        font-weight: 600;
        gap: 8px;
        padding: 5px 14px 5px 5px;
      }
      .logo i {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--acc);
        color: #fff;
        display: grid;
        place-items: center;
        font-style: normal;
        font-weight: 700;
      }
      .nav {
        overflow-x: auto;
        max-width: 100%;
      }
      .nav button {
        padding: 8px 15px;
        border-radius: 99px;
        font-size: 13px;
        white-space: nowrap;
        transition:
          background 0.25s,
          color 0.25s;
      }
      .nav button:hover {
        background: var(--soft);
      }
      .nav button.on {
        background: var(--dark);
        color: var(--onDark);
      }
      .ib {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }
      .ib:hover {
        background: var(--soft);
      }
      .user {
        padding: 5px 12px 5px 5px;
        gap: 10px;
        font-size: 12px;
        line-height: 1.2;
      }
      .user i {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: linear-gradient(135deg, #444, #111);
        color: #fff;
        display: grid;
        place-items: center;
        font-style: normal;
        font-size: 11px;
      }
      .user small {
        color: var(--mut);
        font-size: 10px;
        display: block;
      }
      .body {
        display: grid;
        grid-template-columns: 44px 1fr;
        gap: 20px;
        margin-top: 18px;
      }
      .rail {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
        position: sticky;
        top: 16px;
        align-self: start;
      }
      .rail .grp {
        display: flex;
        flex-direction: column;
        gap: 4px;
        background: var(--card);
        border-radius: 99px;
        padding: 5px;
      }
      .rail button {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--mut);
        transition: all 0.25s;
      }
      .rail button:hover {
        color: var(--ink);
        background: var(--soft);
      }
      .rail button.on {
        background: var(--dark);
        color: var(--onDark);
        transform: scale(1.06);
      }
      main {
        min-width: 0;
        min-height: 560px;
      }
      h1 {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .top p {
        color: var(--mut);
        font-size: 13px;
        margin-top: 4px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 9px 16px;
        border-radius: 99px;
        background: var(--dark);
        color: var(--onDark);
        font-size: 13px;
        font-weight: 500;
        transition: transform 0.15s;
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn.l {
        background: var(--soft);
        color: var(--ink);
      }
      .c {
        background: var(--card);
        border-radius: 20px;
        padding: 18px;
        min-width: 0;
      }
      .c h3 {
        font-size: 15px;
        font-weight: 600;
      }
      .sub {
        color: var(--mut);
        font-size: 12px;
        margin-top: 2px;
      }
      .big {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 6px 0;
      }
      .tag {
        display: inline-block;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 99px;
        background: var(--okbg);
        color: var(--ok);
      }
      .tag.b {
        background: var(--badbg);
        color: var(--bad);
      }
      .g {
        display: grid;
        gap: 14px;
      }
      .ov {
        grid-template-columns: 1.1fr 1.25fr 1.25fr;
      }
      .ov .w2 {
        grid-column: span 2;
      }
      .q {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .q .c {
        background: var(--soft);
        padding: 14px;
      }
      .q .c b {
        font-size: 24px;
        font-weight: 600;
        display: block;
        margin: 10px 0 8px;
      }
      .q .hot {
        background: linear-gradient(145deg, var(--acc2), var(--acc));
        color: #fff;
        grid-row: span 1;
      }
      .q .hot .sub,
      .q .hot .tag {
        color: #fff;
      }
      .q .hot .tag {
        background: rgba(255, 255, 255, 0.22);
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .sp {
        justify-content: space-between;
      }
      .wal {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 12px;
        background: var(--soft);
        border-radius: 14px;
        padding: 10px;
      }
      .wal div {
        background: var(--card);
        border-radius: 10px;
        padding: 8px;
        font-size: 11px;
      }
      .wal b {
        display: block;
        font-size: 12px;
        margin-top: 4px;
      }
      .chart {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 170px;
        margin-top: 14px;
        padding: 12px;
        background: var(--soft);
        border-radius: 14px;
      }
      .chart .col {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        gap: 4px;
        height: 100%;
        font-size: 10px;
        color: var(--mut);
      }
      .bar {
        width: 100%;
        border-radius: 5px;
        background: var(--dark);
        transform-origin: bottom;
        animation: grow 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        animation-delay: calc(var(--i) * 70ms + 0.3s);
      }
      .bar.p {
        background: repeating-linear-gradient(
          135deg,
          var(--acc) 0 3px,
          var(--acc2) 3px 6px
        );
      }
      .bar.g0 {
        background: var(--line);
      }
      .prog {
        height: 8px;
        border-radius: 9px;
        background: var(--line);
        overflow: hidden;
        margin: 10px 0;
      }
      .prog i {
        display: block;
        height: 100%;
        width: var(--w);
        border-radius: 9px;
        background: repeating-linear-gradient(
          135deg,
          var(--acc) 0 4px,
          var(--acc2) 4px 8px
        );
        transform-origin: left;
        animation: fill 1s 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      .li:first-of-type {
        border-top: 0;
      }
      .ico {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--soft);
        display: grid;
        place-items: center;
        font-weight: 600;
        font-size: 12px;
        flex: none;
      }
      .li .t {
        flex: 1;
        min-width: 0;
      }
      .li .t small {
        display: block;
        color: var(--mut);
        font-size: 11px;
      }
      .neg {
        color: var(--bad);
      }
      .pos {
        color: var(--ok);
      }
      .st4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .st4 .c b {
        font-size: 22px;
        display: block;
        margin: 8px 0;
      }
      .two {
        grid-template-columns: 1.8fr 1fr;
      }
      .tabs {
        display: inline-flex;
        gap: 4px;
        background: var(--soft);
        padding: 4px;
        border-radius: 99px;
        margin-bottom: 12px;
      }
      .tabs button {
        padding: 5px 12px;
        border-radius: 99px;
        font-size: 12px;
        color: var(--mut);
      }
      .tabs .on {
        background: var(--dark);
        color: var(--onDark);
      }
      .tw {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        min-width: 480px;
      }
      th {
        text-align: left;
        color: var(--mut);
        font-weight: 500;
        padding: 10px 8px;
        background: var(--soft);
      }
      td {
        padding: 11px 8px;
        border-top: 1px solid var(--line);
      }
      tr.rw {
        animation: up 0.4s both;
        animation-delay: calc(var(--i) * 60ms);
      }
      tbody tr:hover td {
        background: var(--soft);
      }
      .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        margin-right: 6px;
      }
      .card3d {
        perspective: 900px;
        background: var(--soft);
        border-radius: 16px;
        padding: 22px;
      }
      .cd {
        position: relative;
        height: 190px;
        max-width: 320px;
        margin: auto;
        transform-style: preserve-3d;
        transition: transform 0.8s cubic-bezier(0.3, 0.8, 0.2, 1);
        cursor: pointer;
      }
      .cd.f {
        transform: rotateY(180deg);
      }
      .cd > div {
        position: absolute;
        inset: 0;
        border-radius: 16px;
        padding: 18px;
        color: #fff;
        backface-visibility: hidden;
        background: linear-gradient(145deg, #2a2a30, #0d0d10);
        box-shadow: 0 16px 30px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .cd .bk {
        transform: rotateY(180deg);
        background: linear-gradient(145deg, #3a3a42, #16161a);
      }
      .chip {
        display: flex;
        gap: 4px;
        justify-content: flex-end;
      }
      .chip i {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #eb001b;
      }
      .chip i + i {
        background: #f79e1b;
        margin-left: -10px;
        opacity: 0.9;
      }
      .sw {
        width: 38px;
        height: 22px;
        border-radius: 99px;
        background: var(--line);
        position: relative;
        flex: none;
        transition: background 0.25s;
      }
      .sw::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.25s;
      }
      .sw.on {
        background: var(--acc);
      }
      .sw.on::after {
        transform: translateX(16px);
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--acc);
      }
      .av {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 600;
        font-size: 12px;
        border: 3px solid transparent;
        background-clip: padding-box;
        box-shadow: 0 0 0 2px transparent;
        transition:
          box-shadow 0.25s,
          transform 0.25s;
      }
      .pk {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        padding: 6px 8px;
        border-radius: 12px;
      }
      .pk.on {
        background: var(--soft);
      }
      .pk.on .av {
        box-shadow: 0 0 0 2px var(--acc);
        transform: scale(1.08);
      }
      .amt {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--card);
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 22px;
        font-weight: 600;
        margin: 10px 0;
      }
      .amt input {
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        width: 100%;
        outline: 0;
      }
      .chips {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }
      .chips button {
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 99px;
      }
      .chips .on {
        background: var(--dark);
        color: var(--onDark);
      }
      .cg {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
      .cg .c {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        position: relative;
      }
      .cg .c .av {
        width: 48px;
        height: 48px;
      }
      .cg .star {
        position: absolute;
        top: 12px;
        right: 14px;
        color: var(--acc2);
      }
      .ring {
        position: relative;
        width: 96px;
        height: 96px;
        margin: 10px auto;
      }
      .ring svg {
        width: 96px;
        height: 96px;
        transform: rotate(-90deg);
      }
      .ring circle {
        fill: none;
        stroke-width: 9;
        stroke-linecap: round;
      }
      .ring .t {
        stroke: var(--line);
      }
      .ring .v {
        stroke: var(--acc);
        stroke-dasharray: 100;
        stroke-dashoffset: calc(100 - var(--p));
        animation: ring 1.2s 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .ring b {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 18px;
        font-weight: 600;
      }
      .gl {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        margin-top: 14px;
      }
      .gl .c {
        text-align: center;
      }
      .sk {
        background: var(--card);
        border-radius: 20px;
        height: 220px;
        position: relative;
        overflow: hidden;
      }
      .sk::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          100deg,
          transparent 30%,
          var(--soft) 50%,
          transparent 70%
        );
        animation: sh 1s infinite;
      }
      .blur {
        filter: blur(7px);
        opacity: 0.6;
      }
      .r {
        animation: up 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        animation-delay: calc(var(--i) * 80ms);
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.985);
          filter: blur(5px);
        }
      }
      @keyframes grow {
        from {
          transform: scaleY(0);
        }
      }
      @keyframes fill {
        from {
          transform: scaleX(0);
        }
      }
      @keyframes ring {
        from {
          stroke-dashoffset: 100;
        }
      }
      @keyframes sh {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(100%);
        }
      }
      @media (max-width: 900px) {
        .ov,
        .two,
        .st4 {
          grid-template-columns: 1fr 1fr;
        }
        .ov .w2 {
          grid-column: span 2;
        }
        .two > *:last-child {
          grid-column: span 2;
        }
      }
      @media (max-width: 640px) {
        .shell {
          margin: 0;
          border-radius: 0;
          padding: 12px;
        }
        .body {
          grid-template-columns: 1fr;
        }
        .rail {
          flex-direction: row;
          position: static;
          justify-content: center;
        }
        .rail .grp {
          flex-direction: row;
        }
        .ov,
        .two,
        .st4 {
          grid-template-columns: 1fr;
        }
        .ov .w2,
        .two > *:last-child {
          grid-column: auto;
        }
        h1 {
          font-size: 24px;
        }
        .user span {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01s !important;
          animation-delay: 0s !important;
          transition-duration: 0.01s !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="pill logo"><i>V</i>Vertix</div>
        <nav class="pill nav" id="nav"></nav>
        <div class="row" style="gap: 10px">
          <div class="pill">
            <button class="ib" aria-label="Search" data-i="search"></button
            ><button
              class="ib"
              aria-label="Notifications"
              data-i="bell"
            ></button>
          </div>
          <div class="pill user">
            <i>CX</i><span>Code XR<small>hello@codexr.studio</small></span>
          </div>
        </div>
      </header>
      <div class="body">
        <aside class="rail">
          <div class="grp">
            <button id="th" aria-label="Toggle theme" data-i="sun"></button>
          </div>
          <div class="grp" id="rail"></div>
        </aside>
        <main id="main"></main>
      </div>
    </div>
    <script>
      const P = {
        grid: "M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z",
        list: "M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01",
        users:
          "M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8",
        layers: "M12 2 2 7l10 5 10-5zM2 17l10 5 10-5M2 12l10 5 10-5",
        card: "M2 5h20v14H2zM2 10h20",
        search: "M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3",
        bell: "M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0",
        sun: "M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4",
        moon: "M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z",
        plus: "M12 5v14M5 12h14",
        swap: "M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3",
        send: "M22 2 11 13M22 2l-7 20-4-9-9-4z",
        down: "M12 5v14M5 12l7 7 7-7",
        star: "M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.8 5.8 21l1.4-7L2 9.3l7-.8z",

      const ic = (n) =>
