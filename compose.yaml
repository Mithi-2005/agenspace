services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentdesk
      POSTGRES_USER: agentdesk
      POSTGRES_PASSWORD: agentdesk_dev_only
    ports:
      - "5433:5432"
    volumes:
      - agentdesk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentdesk -d agentdesk"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  agentdesk_postgres_data:
